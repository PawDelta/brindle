name: Feature request
description: Suggest something new for brindle, or a change to how it works.
type: Feature
labels: ["enhancement"]
projects: ["PawDelta/1"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What brindle should do instead.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use now, or other ways this could work.
