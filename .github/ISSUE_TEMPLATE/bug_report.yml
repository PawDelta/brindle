name: Bug report
description: Something in brindle doesn't work as it should.
type: Bug
labels: ["bug"]
projects: ["PawDelta/1"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. Paste exact error text if there is any.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. brindle ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: brindle version
      description: Output of `brindle --version`.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - CLI / TUI
        - Desktop app
        - Supervisor or workers (MCP tools, autopilot, pipeline)
        - Other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and agent
      description: e.g. macOS 15, Claude Code 2.x
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove secrets first.
      render: text
