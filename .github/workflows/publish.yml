# Publishes to PyPI when a GitHub release is published, via Trusted Publishing
# (no API token). PyPI must list this repo, workflow file "publish.yml", and
# environment "pypi" as a trusted publisher for the brindle project. Only an
# engine release (a v* tag) publishes: the desktop app's app-v* tags make no
# GitHub Release, and every job here skips any other tag regardless.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    if: startsWith(github.event.release.tag_name, 'v')
    uses: ./.github/workflows/ci.yml
    # A called workflow can't ask for more than its caller grants: ci.yml's test
    # job reads pull requests and issues (for the new-test check, which a
    # release skips), and the run fails to start without these.
    permissions:
      contents: read
      pull-requests: read
      issues: read

  build:
    if: startsWith(github.event.release.tag_name, 'v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Check the release tag matches the package version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::release tag $GITHUB_REF_NAME doesn't match pyproject version $version"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # CloudFormation quick-create only accepts S3 URLs, so each release copies the
  # AWS template to the bucket named by the repository variable
  # DEPLOY_TEMPLATES_BUCKET (credentials: the repository variable
  # DEPLOY_TEMPLATES_ROLE_ARN, via OIDC). Does nothing when the bucket is unset.
  deploy-templates:
    if: startsWith(github.event.release.tag_name, 'v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      BUCKET: ${{ vars.DEPLOY_TEMPLATES_BUCKET }}
      ROLE_ARN: ${{ vars.DEPLOY_TEMPLATES_ROLE_ARN }}
      AWS_REGION: ${{ vars.DEPLOY_TEMPLATES_REGION || 'us-east-1' }}
    steps:
      - name: No bucket configured
        if: env.BUCKET == ''
        run: echo "DEPLOY_TEMPLATES_BUCKET is unset; skipping the template upload."
      - uses: actions/checkout@v7
        if: env.BUCKET != ''
      - uses: aws-actions/configure-aws-credentials@v4
        if: env.BUCKET != ''
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload the AWS template
        if: env.BUCKET != ''
        run: |
          version="${GITHUB_REF_NAME#v}"
          aws s3 cp deploy/aws/brindle-ci-bedrock.yaml \
            "s3://$BUCKET/templates/$version/brindle-ci-bedrock.yaml"

  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/brindle
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Tell pawdelta.com/brindle about the release: PawDelta/pawdelta-web's "Sync
  # brindle release" workflow (repository_dispatch brindle-release) rebuilds
  # the changelog and opens its PR. Needs the repository secret
  # SITE_DISPATCH_TOKEN (a token with Contents: write on pawdelta-web); without
  # it this skips and the site's hourly sync picks the release up instead.
  notify-site:
    if: startsWith(github.event.release.tag_name, 'v')
    needs: publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
    steps:
      - name: No token configured
        if: env.GH_TOKEN == ''
        run: echo "SITE_DISPATCH_TOKEN is unset; the site's hourly sync will pick up the release."
      - name: Start the site's release sync
        if: env.GH_TOKEN != ''
        run: |
          gh api repos/PawDelta/pawdelta-web/dispatches \
            -f event_type=brindle-release \
            -F "client_payload[version]=${GITHUB_REF_NAME}"
