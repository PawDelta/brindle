# Builds the macOS engine the desktop app bundles and checks it still works from
# a new path (app/scripts/check_relocated_engine.sh), only when something that
# goes into it changes.
name: Engine bundle

on:
  pull_request:
    paths:
      - "app/scripts/build_engine.sh"
      - "app/scripts/check_relocated_engine.sh"
      - "app/scripts/engine/**"
      - "src/brindle/codex_hook.py"
      - "src/brindle/providers.py"
      - "pyproject.toml"
      - ".github/workflows/engine-bundle.yml"
  push:
    branches: [main]
    paths:
      - "app/scripts/build_engine.sh"
      - "app/scripts/check_relocated_engine.sh"
      - "app/scripts/engine/**"
      - "src/brindle/codex_hook.py"
      - "src/brindle/providers.py"
      - "pyproject.toml"
      - ".github/workflows/engine-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relocation:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: bash app/scripts/build_engine.sh
      - run: bash app/scripts/check_relocated_engine.sh app/src-tauri/engine
