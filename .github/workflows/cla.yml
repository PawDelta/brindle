name: CLA

# Asks every pull request author to sign CLA.md once. Signatures are stored
# in signatures/cla.json on the cla-signatures branch, outside main's branch protection.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the Brindle CLA and I hereby sign it'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/hmlerner/brindle-ai/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: hmlerner,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the Brindle CLA and I hereby sign it
          custom-notsigned-prcomment: >-
            Thanks for the contribution! Before it can be merged, please read the
            [Brindle Contributor License Agreement](https://github.com/hmlerner/brindle-ai/blob/main/CLA.md)
            and sign it by commenting with the exact sentence below.
