# The desktop app (app/): Vitest, the front-end build, the shell's Rust tests
# and a check that app/src/api/schema.ts still matches the engine's API schema,
# on every pull request and push to main that touches the app, that schema,
# the app's workflows or the pre-push hook's release-tag guard (tested in
# app/scripts/publish_gate.test.ts). The Python suite (ci.yml) skips app-only
# changes, so an app-only pull request runs only this.
name: App

on:
  pull_request:
    paths:
      - "app/**"
      - "src/brindle/daemon/api-schema.json"
      - ".github/workflows/app*.yml"
      - ".githooks/pre-push"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"            # the app bundles the engine: app-release.yml's gate needs this run
      - "pyproject.toml"
      - "uv.lock"
      - "src/brindle/daemon/api-schema.json"
      - ".github/workflows/app*.yml"
      - ".githooks/pre-push"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm --prefix app ci
      - name: Test
        run: npm --prefix app test -- --run
      - name: Build
        run: npm --prefix app run build
      # The engine and the app come from one commit, so their contract can't drift.
      - name: API types match the engine's schema
        run: |
          npm --prefix app run gen:api
          git diff --exit-code -- app/src/api/schema.ts \
            || { echo "::error::app/src/api/schema.ts is stale: run npm --prefix app run gen:api and commit it"; exit 1; }

  e2e:
    # The flows in Chromium over the fake daemon (app/e2e/flows.e2e.ts). pty, scroll and
    # terminal e2e need a real Claude Code, tmux or the Rust bridge, so they aren't run here.
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest (26.04) runners could not resolve the Ubuntu archive on 2026-11-11
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm --prefix app ci
      - name: Playwright version
        id: playwright
        run: echo "version=$(npm --prefix app ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install browser
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx --prefix app playwright install --with-deps chromium
      # A cached browser still needs the system libraries the runner image lacks.
      - name: Install browser system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx --prefix app playwright install-deps chromium
      - name: E2E
        run: npm --prefix app run test:e2e -- --project=chromium e2e/flows.e2e.ts

  rust:
    # macOS, where the app runs: the pane-view tests drive a real tmux, and need
    # a current one (Ubuntu 22.04's apt tmux is too old for three of them).
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tmux
        run: bash app/scripts/retry.sh brew install tmux
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src-tauri/target
          key: cargo-test-${{ runner.os }}-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-test-${{ runner.os }}-
      # The shell embeds the front end's dist/ at compile time.
      - name: Front end for the shell
        run: |
          mkdir -p app/dist
          [ -f app/dist/index.html ] || echo '<!doctype html>' > app/dist/index.html
      - name: Test
        run: cargo test --manifest-path app/src-tauri/Cargo.toml

  visual-sandbox:
    # The ship gate for in-app visuals: hostile pages in a real webview on each
    # platform the app ships for, and a listener that must see nothing
    # (app/src-tauri/tests/visual_probes.rs). WKWebView, WebView2 and
    # WebKitGTK each have their own request blocker, so each runs.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]   # 24.04: see e2e
    runs-on: ${{ matrix.os }}
    # The suite runs in under a minute; the harness's own watchdog fails a
    # hung probe by name after 60s, so this only guards the build.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: WebKitGTK and the shell's Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev xvfb
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src-tauri/target
          key: cargo-probes-${{ runner.os }}-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-probes-${{ runner.os }}-
      # The shell embeds the front end's dist/ at compile time.
      - name: Front end for the shell
        shell: bash
        run: |
          mkdir -p app/dist
          [ -f app/dist/index.html ] || echo '<!doctype html>' > app/dist/index.html
      - name: Sandbox unit tests
        run: cargo test --manifest-path app/src-tauri/Cargo.toml --lib visual_scheme
      - name: Hostile probes, zero requests
        if: runner.os != 'Linux'
        run: cargo test --manifest-path app/src-tauri/Cargo.toml --test visual_probes
      - name: Hostile probes, zero requests (under Xvfb)
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: xvfb-run --auto-servernum cargo test --manifest-path app/src-tauri/Cargo.toml --test visual_probes

  windows-compile:
    # The shell has Windows-only and Unix-only code, and only a stable release
    # built it for Windows: 0.6.0's Windows build failed on a libc constant
    # no pull request had compiled.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src-tauri/target
          key: cargo-check-${{ runner.os }}-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-check-${{ runner.os }}-
      # The shell embeds the front end's dist/ at compile time.
      - name: Front end for the shell
        shell: bash
        run: |
          mkdir -p app/dist
          [ -f app/dist/index.html ] || echo '<!doctype html>' > app/dist/index.html
      # What a Windows release builds, and its tests; not examples/pty_ws.rs, a Unix-only developer tool.
      - name: Compile, tests included
        run: cargo check --manifest-path app/src-tauri/Cargo.toml --lib --bins --tests
