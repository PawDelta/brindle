name: CI

# One Linux and one macOS job on every pull request and push to main (a push
# or PR that only changes docs runs nothing). The local pre-push tests are off
# for now; scripts/ci_local.sh still works by hand.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "*.md", "docs/**", "assets/**", "LICENSE", "CLA.md"]
  pull_request:
    paths-ignore: ["**/*.md", "*.md", "docs/**", "assets/**", "LICENSE", "CLA.md"]
  workflow_dispatch:
  workflow_call:   # a release runs the same two jobs

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -yq tmux
          else brew install tmux; fi
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest -q
