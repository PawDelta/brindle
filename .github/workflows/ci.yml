name: CI

# Actions minutes cost money on this private repo, so the paid matrix runs only
# where it earns its keep. Test before pushing with scripts/ci_local.sh (the
# pre-push hook runs its quick leg; --report posts a free `local-ci` status on a
# PR's commit). Here: one Linux job per push to main, and the whole matrix
# (macOS minutes count ten times) only when run by hand or by a release.
# A push that only changes docs runs nothing.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "*.md", "docs/**", "assets/**", "LICENSE", "CLA.md"]
  workflow_dispatch:
  workflow_call:   # a release: always the full matrix, whatever event started it
    inputs:
      full:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && !inputs.full && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest"]') }}
        python: ${{ fromJSON(github.event_name == 'push' && !inputs.full && '["3.12"]' || '["3.11", "3.12", "3.13"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -yq tmux
          else brew install tmux; fi
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest -q
