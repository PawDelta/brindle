name: dbg
on:
  push:
    branches: [dbg/pty-view-linux]
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -yq tmux
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest -q -s -n auto -m 'not serial' -p no:cacheprovider 2>&1 | grep -E "DBG|passed|failed|FAILED"
        continue-on-error: true
