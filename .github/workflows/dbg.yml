name: dbg
on:
  push:
    branches: [dbg/pty2]
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -yq tmux
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest -q -n auto -m 'not serial' -p no:cacheprovider --cov=brindle --cov=scripts --cov-branch --cov-context=test --cov-report= 2>&1 | tail -40
        continue-on-error: true
      - run: cat /tmp/dbg.log | tail -60
        if: always()
