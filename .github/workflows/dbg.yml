name: dbg
on:
  push:
    branches: [dbg/pty2]
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -q && sudo apt-get install -yq tmux
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync
      - run: |
          for i in 1 2 3 4 5 6 7 8; do (while :; do :; done) & done
          pass=0; fail=0
          for i in $(seq 1 120); do
            if uv run pytest -q -x -p no:cacheprovider tests/test_daemon_pty_view.py -k pane_types > out.$i 2>&1; then pass=$((pass+1)); else fail=$((fail+1)); grep -E "DBGDUMP" out.$i | head -3; fi
          done
          echo "pass=$pass fail=$fail"
          kill $(jobs -p) || true
        continue-on-error: true
