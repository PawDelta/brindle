<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>brindle</title>
<style>
  :root { --bg: #fafaf8; --fg: #1d1d1b; --dim: #6b6b66; --line: #e2e1dc; --card: #fff;
          --ok: #2f7d3b; --busy: #8a3fa0; --alert: #a86b00; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #e8e7e3; --dim: #9a9993; --line: #2e2d2a; --card: #1e1e1c;
            --ok: #6cc47a; --busy: #c58fd6; --alert: #e0a73a; --bad: #ef7a72; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 12px 16px;
           border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 16px; }
  header .dim { font-size: 12px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px;
         padding: 16px; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 6px;
            padding: 12px 14px; min-width: 0; }
  section h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase;
               letter-spacing: .04em; color: var(--dim); }
  .dim { color: var(--dim); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .ws { padding: 8px 0; border-top: 1px solid var(--line); }
  .ws:first-of-type { border-top: 0; }
  .ws-head { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .ws-select { font: inherit; font-weight: 600; color: inherit; background: transparent;
               border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  .ws-select[aria-pressed="true"] { color: var(--busy); }
  #diff pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 400px; overflow: auto; }
  #diff h3 { font-size: 13px; margin-bottom: 4px; }
  .agent { display: flex; gap: 8px; padding: 2px 0 2px 14px; flex-wrap: wrap; }
  .status { font-weight: 600; }
  .s-ok { color: var(--ok); } .s-busy { color: var(--busy); }
  .s-alert { color: var(--alert); } .s-bad { color: var(--bad); }
  ol.milestones { margin: 0; padding-left: 20px; }
  ol.milestones li { margin: 4px 0; }
  details pre { white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto;
                margin: 4px 0 0; padding: 6px; background: var(--bg); border-radius: 4px; }
  .panel-slot:empty::before { content: "Coming soon."; color: var(--dim); }
  #error { color: var(--bad); }
  #chat-agent { width: 100%; margin-bottom: 8px; }
  #chat-log { max-height: 320px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
  .msg { white-space: pre-wrap; word-break: break-word; padding: 6px 8px; border-radius: 6px;
         background: var(--bg); max-width: 92%; }
  .msg.user { align-self: flex-end; border: 1px solid var(--line); }
  #chat-form { display: flex; gap: 8px; align-items: flex-start; margin-top: 8px; flex-wrap: wrap; }
  #chat-text { flex: 1 1 200px; font: inherit; }
</style>
</head>
<body>
<header>
  <h1>brindle</h1>
  <span id="repo" class="dim mono"></span>
  <span id="updated" class="dim"></span>
  <span id="error"></span>
</header>
<main>
  <section id="agents-panel">
    <h2>Workspaces and agents</h2>
    <div id="workspaces"></div>
  </section>
  <section id="goal-panel">
    <h2>Goal</h2>
    <div id="goal"></div>
  </section>
  <!-- Chat panel: filled by web/chat.py's routes and its own script. -->
  <section id="chat-panel">
    <h2>Chat</h2>
    <div id="chat" data-panel="chat">
      <select id="chat-agent" aria-label="Agent to chat with"></select>
      <div id="chat-log" aria-live="polite"></div>
      <form id="chat-form">
        <textarea id="chat-text" rows="2" placeholder="Message this agent (Enter sends, Shift+Enter for a new line)"></textarea>
        <button type="submit">Send</button>
        <span id="chat-note" class="dim"></span>
      </form>
    </div>
  </section>
  <!-- Diff panel: filled by web/diff.py's routes and its own script. -->
  <section id="diff-panel">
    <h2>Diff</h2>
    <div id="diff" data-panel="diff" aria-live="polite">Select a workspace to see its changes, reviews and checks.</div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
