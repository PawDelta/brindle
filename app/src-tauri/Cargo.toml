[package]
name = "brindle-desktop"
version = "0.1.0"
description = "The brindle desktop app"
authors = ["PawDelta"]
license-file = "../../LICENSE"
edition = "2021"
rust-version = "1.77"

[lib]
name = "brindle_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
httparse = "1"
reqwest = "0.13"
# The update checks' time limits, their periodic tick and one look at a time (updates.rs), on Tauri's own tokio runtime.
tokio = { version = "1", features = ["time", "sync"] }
# The repos brindle knows, read from its database (read-only) to decide air-gap before an update
# check without waiting on the daemon (updates.rs `known_repos`).
rusqlite = { version = "0.37", features = ["bundled"] }
tungstenite ={ version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]
tauri = { version = "2", features = ["tray-icon", "test"] }
base64 = "0.22"
minisign-verify = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
