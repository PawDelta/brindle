[project]
name = "brindle"
version = "0.3.1"
description = "Run coding agents in parallel, each on its own git branch, with a supervisor that delegates, reviews, and merges"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-brindle-1.0"
license-files = ["LICENSE", "SCHEDULE-A"]
authors = [{ name = "Hannah Lerner" }]
keywords = ["ai", "agents", "claude-code", "codex", "git", "worktree", "tmux", "mcp", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.12",
    "mcp>=2.2,<3",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://pawdelta.com/brindle/"
Documentation = "https://pawdelta.com/brindle/docs/recommended-use"
Changelog = "https://pawdelta.com/brindle/changelog"
Support = "https://pawdelta.com/brindle/docs/faq"

[project.scripts]
brindle = "brindle.cli:app"

# brindle Pro and Team (src/brindle/pro): inert without a verified entitlement.
[project.entry-points."brindle.account"]
pro = "brindle.pro.account:make"

[project.entry-points."brindle.policy"]
pro = "brindle.pro.team_policy:make"

[project.entry-points."brindle.events"]
pro = "brindle.pro.team_events:make"
audit = "brindle.pro.audit_chain:make"
audit_export = "brindle.pro.audit_export:make"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
    "python-hcl2>=8.1.4",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brindle"]
# Metadata 2.5 is newer than twine/PyPI tooling reliably accepts.
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
# The source release carries the code, the README and the license only:
# no tests, CI, scripts or development config.
only-include = ["src", "README.md", "LICENSE", "SCHEDULE-A", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["serial: run outside xdist (`pytest -m serial`); the parallel pass skips these"]
