[project]
name = "frith"
version = "0.0.1"
description = "Run coding agents in parallel, each on its own git branch, with a supervisor that delegates, reviews, and merges"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-frith-1.0"
license-files = ["LICENSE", "SCHEDULE-A"]
authors = [{ name = "Hannah Lerner" }]
keywords = ["ai", "agents", "claude-code", "codex", "git", "worktree", "tmux", "mcp", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.12",
    "mcp>=2.2,<3",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://pawdelta.com/frith/"
Documentation = "https://pawdelta.com/frith/docs/recommended-use"
Changelog = "https://pawdelta.com/frith/changelog"
Support = "mailto:support@pawdelta.com"

[project.scripts]
frith = "frith.cli:app"

# frith Pro and Team (src/frith/pro): inert without a verified entitlement.
[project.entry-points."frith.account"]
pro = "frith.pro.account:make"

[project.entry-points."frith.policy"]
pro = "frith.pro.team_policy:make"

[project.entry-points."frith.events"]
pro = "frith.pro.team_events:make"
audit = "frith.pro.audit_chain:make"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frith"]
# Metadata 2.5 is newer than twine/PyPI tooling reliably accepts.
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
# The source release carries the code, the README and the license only:
# no tests, CI, scripts or development config.
only-include = ["src", "README.md", "LICENSE", "SCHEDULE-A", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
